<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재정 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  --bg: #f5f6f7;
  --card: #ffffff;
  --line: #e3e5e8;
  --text: #1c1f23;
  --sub: #6b7280;
  --point: #0f766e;
  --point-weak: #e6f2f1;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Pretendard, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  word-break: keep-all;
}
.wrap { max-width: 880px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
h1 { font-size: 22px; margin: 0; }
h2 { font-size: 16px; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

button, .tab {
  font: inherit;
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
  cursor: pointer;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--text);
  padding: 8px 14px;
}
button:hover { background: #f0f1f3; }
button.primary { background: var(--point); border-color: var(--point); color: #fff; }
button.primary:hover { background: #0c5f59; }
button.small { padding: 4px 10px; font-size: 13px; }
button, input, select, summary { outline: none; }
.login { max-width: 400px; margin: 40px auto; }
.login a { color: var(--point); font-size: 14px; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 2px solid var(--point);
  outline-offset: 2px;
}

.tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; }
.tab.on { background: var(--point); border-color: var(--point); color: #fff; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
.summary .card { margin: 0; }
.label { color: var(--sub); font-size: 13px; }
.big { font-size: 22px; font-weight: 700; }
.net .big { color: var(--point); }

.bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--sub); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }

.row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.amt[data-id] { touch-action: manipulation; border-radius: 6px; padding: 2px 6px; }
.amt[data-id]:hover { background: var(--point-weak); }
.amt-edit { width: 150px; font: inherit; font-weight: 600; text-align: right; padding: 4px 8px; border: 1px solid var(--point); border-radius: 6px; background: #fff; color: var(--text); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--line); }
.quick .q { display: flex; flex-direction: column; gap: 3px; flex: 1 1 110px; min-width: 0; }
.quick .q.grow { flex: 2 1 160px; }
.quick .q span { font-size: 12px; color: var(--sub); }
.quick input, .quick select { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
.quick .q-calc { flex-basis: 100%; margin: 0; }
.row .name { flex: 1; min-width: 0; }
.row .amt { font-weight: 600; }
.empty { color: var(--sub); font-size: 14px; padding: 8px 0; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 8px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
th { color: var(--sub); font-weight: 500; }
th:first-child, td:first-child { text-align: left; }
.scroll { overflow-x: auto; max-height: 360px; overflow-y: auto; }
details summary { cursor: pointer; color: var(--point); font-size: 14px; margin-top: 10px; user-select: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal { background: var(--card); border-radius: 14px; padding: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; }
.modal h2 { margin-bottom: 14px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
.field input, .field select { width: 100%; font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text); }
.hint { font-size: 12px; color: var(--sub); margin-top: 3px; min-height: 18px; }
.actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1c1f23; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 14px; z-index: 20; white-space: nowrap; }
[hidden] { display: none !important; }

@media (max-width: 600px) {
  .summary, .stats { grid-template-columns: 1fr; }
  .big { font-size: 20px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>재정 관리</h1>
    <div id="head-actions" hidden>
      <span class="label" id="sync"></span>
      <button data-action="export">백업 저장</button>
      <button data-action="import">백업 불러오기</button>
      <button data-action="logout">로그아웃</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <button class="tab on" data-tab="home">현황</button>
    <button class="tab" data-tab="trend">순자산 추이</button>
    <button class="tab" data-tab="loan">대출 상환</button>
  </nav>
  <main id="view"></main>
</div>
<div id="modal" class="backdrop" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const KEY = 'finance-v1';
const AUTH_KEY = 'finance-auth';
const PENDING_KEY = 'finance-pending';
const DATA_REPO = 'finance-data';
const DATA_FILE = 'data.json';
const TYPES = { cash: '현금·예금', stock: '주식·투자', realestate: '부동산', other: '기타 자산', debt: '부채' };
const COLORS = { cash: '#0f766e', stock: '#3b9a92', realestate: '#7dbdb7', other: '#b9dcd8' };
const METHODS = { equalPayment: '원리금균등', equalPrincipal: '원금균등', bullet: '만기일시' };

let state = load();
let auth = loadAuth();
let tab = 'home';

/* ---------- 계산 ---------- */
function monthIdx(ym) { const [y, m] = ym.split('-').map(Number); return y * 12 + m - 1; }
function ymStr(i) { return Math.floor(i / 12) + '-' + String(i % 12 + 1).padStart(2, '0'); }
function monthLabel(i) { return Math.floor(i / 12) + '년 ' + (i % 12 + 1) + '월'; }
function graceMonths(text) { const t = String(text || '').trim(); return t === '' ? 0 : Math.round(Number(t) * 12); }

/* 대출 정보(원금·금리·시작월·만기월)로 현재 잔액·월 상환액·종료 시점 계산 */
function loanInfo(d) {
  if (!d.start || !d.end || !Number.isFinite(d.rate) || d.rate < 0 || !(d.amount > 0)) return null;
  const s = monthIdx(d.start), n = monthIdx(d.end) - s;
  if (!(n >= 1 && n <= 600)) return null;
  const g = d.grace || 0;
  if (!(g >= 0 && g < n)) return null;
  const rows = schedule(d.amount, d.rate, n, d.method, g);
  rows.forEach(r => r.date = monthLabel(s + r.k));
  const paid = Math.min(Math.max(monthIdx(thisMonth()) - s, 0), n);
  const left = rows.slice(paid);
  return {
    rows, left, paid, n,
    done: paid >= n,
    balance: paid ? rows[paid - 1].balance : d.amount,
    payment: left.length ? left[0].payment : 0,
    leftInterest: left.reduce((a, r) => a + r.interest, 0),
    totalInterest: rows.reduce((a, r) => a + r.interest, 0),
    endLabel: monthLabel(monthIdx(d.end)),
    inGrace: paid < g,
    afterMonths: n - g,
    graceEnd: monthLabel(s + g),
    afterPayment: g > 0 ? rows[g].payment : null
  };
}

function curAmount(it) {
  if (it.type === 'debt') { const L = loanInfo(it); if (L) return L.balance; }
  return it.amount;
}

function totals(items) {
  let assets = 0, debts = 0;
  for (const it of items) it.type === 'debt' ? debts += curAmount(it) : assets += curAmount(it);
  return { assets, debts, net: assets - debts };
}

function schedule(P, ratePct, n, method, grace = 0) {
  const r = ratePct / 1200, m = n - grace;
  const pay = r ? P * r / (1 - Math.pow(1 + r, -m)) : P / m;
  const rows = [];
  let bal = P;
  for (let k = 1; k <= n; k++) {
    const interest = bal * r;
    let principal;
    if (k === n) principal = bal;
    else if (k <= grace) principal = 0;
    else if (method === 'equalPayment') principal = pay - interest;
    else if (method === 'equalPrincipal') principal = P / m;
    else principal = 0;
    bal -= principal;
    rows.push({ k, principal, interest, payment: principal + interest, balance: Math.max(bal, 0) });
  }
  return rows;
}

function won(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }

function korean(n) {
  n = Math.round(n);
  if (!n) return '';
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  const eok = Math.floor(n / 1e8), man = Math.floor(n % 1e8 / 1e4), rest = n % 1e4;
  const parts = [];
  if (eok) parts.push(eok.toLocaleString('ko-KR') + '억');
  if (man) parts.push(man.toLocaleString('ko-KR') + '만');
  if (rest) parts.push(rest.toLocaleString('ko-KR'));
  return sign + parts.join(' ') + '원';
}

function shortAmt(n) {
  const a = Math.abs(n), s = n < 0 ? '-' : '';
  if (a >= 1e8) return s + (a / 1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/, '') + '억';
  if (a >= 1e4) return s + Math.round(a / 1e4).toLocaleString('ko-KR') + '만';
  return s + Math.round(a).toLocaleString('ko-KR');
}

/* ---------- 저장 ---------- */
function valid(s) {
  return s && Array.isArray(s.items) && Array.isArray(s.snapshots) &&
    s.items.every(i => TYPES[i.type] && typeof i.name === 'string' && Number.isFinite(i.amount)) &&
    s.snapshots.every(p => /^\d{4}-\d{2}$/.test(p.month) && Number.isFinite(p.assets) && Number.isFinite(p.debts));
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (valid(s)) {
      for (const d of s.items) {
        if (d.type === 'debt' && !d.start && d.months > 0 && d.rate >= 0) {
          d.start = thisMonth();
          d.end = ymStr(monthIdx(d.start) + d.months);
          delete d.months;
        }
      }
      return s;
    }
  } catch (e) {}
  return { items: [], snapshots: [] };
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); if (auth) queueSync(); }

/* ---------- 공통 UI ---------- */
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.hidden = true, 2200);
}

function openModal(html) { $('modal').innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>'; $('modal').hidden = false; }
function closeModal() { $('modal').hidden = true; $('modal').innerHTML = ''; }

let onConfirm = null;
function confirmModal(title, okLabel, fn) {
  onConfirm = fn;
  openModal(`<h2>${esc(title)}</h2>
    <div class="actions"><button data-action="close">취소</button><button class="primary" data-action="confirm">${esc(okLabel)}</button></div>`);
}

/* ---------- 로그인·동기화 (GitHub 비공개 저장소의 data.json) ---------- */
let remoteSha = null, saveTimer = null, saving = false, dirty = false;

function loadAuth() {
  try {
    const a = JSON.parse(localStorage.getItem(AUTH_KEY));
    if (a && a.token && a.owner) return a;
  } catch (e) {}
  return null;
}

function ghFetch(token, path, opts = {}) {
  return fetch('https://api.github.com' + path, {
    ...opts, cache: 'no-store',
    headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) }
  });
}
const dataPath = () => `/repos/${auth.owner}/${DATA_REPO}/contents/${DATA_FILE}`;
function toB64(s) { let bin = ''; new TextEncoder().encode(s).forEach(b => bin += String.fromCharCode(b)); return btoa(bin); }
function fromB64(b) { return new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, '')), c => c.charCodeAt(0))); }
function httpError(res) { const e = new Error('http ' + res.status); e.status = res.status; return e; }

async function pull() {
  const res = await ghFetch(auth.token, dataPath());
  if (res.status === 404) { remoteSha = null; return 'missing'; }
  if (!res.ok) throw httpError(res);
  const j = await res.json();
  const data = JSON.parse(fromB64(j.content));
  if (!valid(data)) throw new Error('format');
  remoteSha = j.sha;
  return data;
}

async function push() {
  const body = { message: 'update', content: toB64(JSON.stringify(state, null, 2)) };
  if (remoteSha) body.sha = remoteSha;
  const res = await ghFetch(auth.token, dataPath(), { method: 'PUT', body: JSON.stringify(body) });
  if (res.status === 409 || res.status === 422) return 'conflict';
  if (!res.ok) throw httpError(res);
  remoteSha = (await res.json()).content.sha;
  return 'ok';
}

function setSync(text) { const el = $('sync'); if (el) el.textContent = text; }
function setState(d) {
  state = { items: d.items, snapshots: d.snapshots };
  localStorage.setItem(KEY, JSON.stringify(state));
}
function dropAuth() {
  auth = null; remoteSha = null;
  localStorage.removeItem(AUTH_KEY);
  render();
}

function queueSync() {
  dirty = true;
  localStorage.setItem(PENDING_KEY, '1');
  setSync('저장 중');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 800);
}

async function flush() {
  if (!auth) return;
  if (saving) { dirty = true; return; }
  saving = true; dirty = false;
  setSync('저장 중');
  let failed = false;
  try {
    if ((await push()) === 'conflict') {
      const d = await pull();
      if (d !== 'missing') { setState(d); render(); toast('다른 기기의 변경 내용 불러옴'); }
      dirty = false;
    }
    if (!dirty) { localStorage.removeItem(PENDING_KEY); setSync('저장됨'); }
  } catch (err) {
    failed = true; dirty = true;
    if (err.status === 401 || err.status === 403) { saving = false; dropAuth(); toast('토큰 확인 필요'); return; }
    setSync('저장 실패');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 10000);
  }
  saving = false;
  if (dirty && !failed) flush();
}
function flushNow() { clearTimeout(saveTimer); return flush(); }

async function syncDown(fromLogin) {
  if (!fromLogin && localStorage.getItem(PENDING_KEY)) { render(); return flushNow(); }
  setSync('불러오는 중');
  try {
    const d = await pull();
    if (d === 'missing' || (fromLogin && state.items.length && !d.items.length)) { render(); return flushNow(); }
    const local = JSON.stringify({ items: state.items, snapshots: state.snapshots });
    const changed = local !== JSON.stringify({ items: d.items, snapshots: d.snapshots });
    if (changed) {
      if (fromLogin && state.items.length) localStorage.setItem(KEY + '-prelogin', local);
      setState(d);
    }
    if (changed || fromLogin) render();
    setSync('저장됨');
  } catch (err) {
    if (err.status === 401 || err.status === 403) { dropAuth(); toast('토큰 확인 필요'); }
    else { render(); setSync('오프라인'); }
  }
}

function loginView() {
  return `<form class="card login" id="login-form">
    <h2>로그인</h2>
    <div class="field" style="margin-top:12px"><label for="login-token">GitHub 토큰</label>
      <input id="login-token" name="token" type="password" autocomplete="current-password" spellcheck="false"></div>
    <div class="actions" style="justify-content:space-between;align-items:center">
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 발급</a>
      <button class="primary" type="submit">로그인</button></div>
  </form>`;
}

document.addEventListener('submit', async e => {
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const token = $('login-token').value.trim();
  if (!token) return toast('토큰 입력 필요');
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    const u = await ghFetch(token, '/user');
    if (u.status === 401) throw new Error('토큰 확인 필요');
    if (!u.ok) throw new Error('로그인 실패');
    const owner = (await u.json()).login;
    const r = await ghFetch(token, `/repos/${owner}/${DATA_REPO}`);
    if (!r.ok) throw new Error(`${owner}/${DATA_REPO} 접근 불가`);
    auth = { token, owner };
    localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
    await syncDown(true);
  } catch (err) {
    toast(err instanceof TypeError ? '네트워크 오류' : err.message);
    const again = e.target.querySelector('button[type="submit"]');
    if (again) again.disabled = false;
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !auth || dirty || saving) return;
  if (!$('modal').hidden || document.activeElement.matches('input,select')) return;
  syncDown(false);
});

/* ---------- 화면 ---------- */
function render() {
  const on = !!auth;
  $('head-actions').hidden = !on;
  $('tabs').hidden = !on;
  if (!on) { $('view').innerHTML = loginView(); return; }
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('view').innerHTML = tab === 'home' ? homeView() : tab === 'trend' ? trendView() : loanView();
}

function summaryCards() {
  const t = totals(state.items);
  return `<section class="summary">
    <div class="card"><div class="label">총자산</div><div class="big num">${won(t.assets)}</div></div>
    <div class="card"><div class="label">총부채</div><div class="big num">${won(t.debts)}</div></div>
    <div class="card net"><div class="label">순자산</div><div class="big num">${won(t.net)}</div></div>
  </section>`;
}

function homeView() {
  const t = totals(state.items);
  const sums = {};
  for (const it of state.items) sums[it.type] = (sums[it.type] || 0) + curAmount(it);
  const monthly = state.items.filter(i => i.type === 'debt').reduce((s, i) => {
    const L = loanInfo(i);
    return s + (L && !L.done ? L.payment : 0);
  }, 0);
  const debtSub = it => {
    const L = it.type === 'debt' ? loanInfo(it) : null;
    if (!L) return '';
    return `<div class="label">${L.done ? '상환 완료' : `${L.inGrace ? '거치 중 · ' : ''}월 ${won(L.payment)}${L.inGrace ? ` · ${L.graceEnd} 이후 월 ${won(L.afterPayment)}` : ''} · ${L.endLabel}까지 · ${L.left.length}개월 남음`}</div>`;
  };

  let comp = '';
  if (t.assets > 0) {
    const keys = Object.keys(COLORS).filter(k => sums[k] > 0);
    comp = `<div class="card"><div class="card-head"><h2>자산 구성</h2></div>
      <div class="bar">${keys.map(k => `<div style="width:${sums[k] / t.assets * 100}%;background:${COLORS[k]}"></div>`).join('')}</div>
      <div class="legend">${keys.map(k => `<span><i class="dot" style="background:${COLORS[k]}"></i>${TYPES[k]} <b class="num">${(sums[k] / t.assets * 100).toFixed(1)}%</b></span>`).join('')}</div>
    </div>`;
  }

  const groups = Object.keys(TYPES).map(type => {
    const list = state.items.filter(i => i.type === type);
    return `<div class="card">
      <div class="card-head"><h2>${TYPES[type]} <span class="label num">${won(sums[type] || 0)}</span>${type === 'debt' && monthly ? ` <span class="label num">· 월 ${won(monthly)}</span>` : ''}</h2></div>
      ${list.length ? list.map(it => `<div class="row">
          <div class="name">${esc(it.name)}${debtSub(it)}</div>
          <div class="amt num" data-id="${it.id}">${won(curAmount(it))}</div>
          <button class="small" data-action="edit" data-id="${it.id}">수정</button>
          <button class="small" data-action="del" data-id="${it.id}">삭제</button>
        </div>`).join('') : '<div class="empty">항목 없음</div>'}
      ${quickForm(type)}
    </div>`;
  }).join('');

  return summaryCards() + comp + groups;
}

function thisMonth() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function chart(points) {
  const W = 600, H = 240, L = 56, R = 16, T = 16, B = 30;
  const vals = points.map(p => p.assets - p.debts);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= Math.abs(min) * 0.1 || 1; max += Math.abs(max) * 0.1 || 1; }
  const pad = (max - min) * 0.1; min -= pad; max += pad;
  const x = i => points.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (points.length - 1);
  const y = v => T + (max - v) * (H - T - B) / (max - min);
  const ticks = [0, 0.5, 1].map(f => min + (max - min) * f);
  const step = Math.ceil(points.length / 6);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="순자산 추이 그래프">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e5e8"/>
      <text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="#6b7280">${shortAmt(v)}</text>`).join('')}
    ${points.length > 1 ? `<polyline fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" points="${vals.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>` : ''}
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#0f766e"><title>${points[i].month} ${won(v)}</title></circle>`).join('')}
    ${points.map((p, i) => i % step === 0 || i === points.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#6b7280">${p.month.slice(2).replace('-', '.')}</text>` : '').join('')}
  </svg>`;
}

function trendView() {
  const pts = state.snapshots;
  return summaryCards() + `<div class="card">
    <div class="card-head"><h2>순자산 추이</h2><button class="primary" data-action="snap">이번 달 기록</button></div>
    ${pts.length ? chart(pts) : '<div class="empty">기록 없음</div>'}
  </div>
  ${pts.length ? `<div class="card"><div class="card-head"><h2>월별 기록</h2></div><div class="scroll"><table>
    <tr><th>월</th><th>자산</th><th>부채</th><th>순자산</th><th></th></tr>
    ${pts.slice().reverse().map(p => `<tr><td>${p.month}</td><td class="num">${won(p.assets)}</td><td class="num">${won(p.debts)}</td>
      <td class="num"><b>${won(p.assets - p.debts)}</b></td>
      <td><button class="small" data-action="delsnap" data-month="${p.month}">삭제</button></td></tr>`).join('')}
  </table></div></div>` : ''}`;
}

function loanView() {
  const debts = state.items.filter(i => i.type === 'debt');
  if (!debts.length) return `<div class="card"><div class="empty">등록된 부채 없음</div>
    <button class="primary" data-tab="home">현황에서 부채 입력</button></div>`;

  let monthSum = 0, interestSum = 0, lastEnd = '';
  const cards = debts.map(d => {
    const L = loanInfo(d);
    if (!L) {
      return `<div class="card"><div class="card-head"><h2>${esc(d.name)} <span class="label num">${won(d.amount)}</span></h2>
        <button class="small" data-action="edit" data-id="${d.id}">대출 정보 입력</button></div></div>`;
    }
    if (!L.done) {
      monthSum += L.payment; interestSum += L.leftInterest;
      if (d.end > lastEnd) lastEnd = d.end;
    }
    return `<div class="card">
      <div class="card-head"><h2>${esc(d.name)}</h2><button class="small" data-action="edit" data-id="${d.id}">수정</button></div>
      <div class="label">원금 <span class="num">${won(d.amount)}</span> · 연 ${d.rate}% · ${monthLabel(monthIdx(d.start))} ~ ${L.endLabel} · ${METHODS[d.method]}${d.grace ? ` · 거치 ${d.grace / 12}년` : ''}</div>
      ${L.done ? '<div class="big" style="margin-top:10px">상환 완료</div>' : `<div class="stats" style="margin-top:10px">
        <div><div class="label">현재 잔액</div><b class="num">${won(L.balance)}</b></div>
        <div><div class="label">${L.inGrace ? '월 이자(거치 중)' : d.method === 'equalPayment' ? '월 상환액' : '이번 달 상환액'}</div><b class="num">${won(L.payment)}</b></div>
        <div><div class="label">상환 종료</div><b class="num">${L.endLabel}</b></div>
        <div><div class="label">남은 기간</div><b class="num">${L.left.length}개월</b></div>
        <div><div class="label">남은 이자</div><b class="num">${won(L.leftInterest)}</b></div>
        <div><div class="label">전체 이자</div><b class="num">${won(L.totalInterest)}</b></div>
        ${d.grace ? `<div><div class="label">거치 종료</div><b class="num">${L.graceEnd}</b></div>
        <div><div class="label">${d.method === 'equalPayment' ? '거치 후 월 상환액' : '거치 후 첫 상환액'}</div><b class="num">${won(L.afterPayment)}</b></div>
        <div><div class="label">거치 후 상환 기간</div><b class="num">${L.afterMonths}개월</b></div>` : ''}
      </div>
      <details><summary>남은 상환 일정</summary><div class="scroll"><table>
        <tr><th>월</th><th>상환액</th><th>원금</th><th>이자</th><th>잔액</th></tr>
        ${L.left.map(r => `<tr><td>${r.date}</td><td class="num">${won(r.payment)}</td><td class="num">${won(r.principal)}</td><td class="num">${won(r.interest)}</td><td class="num">${won(r.balance)}</td></tr>`).join('')}
      </table></div></details>`}
    </div>`;
  }).join('');

  return `<section class="summary">
    <div class="card"><div class="label">매달 나가는 돈</div><div class="big num">${won(monthSum)}</div></div>
    <div class="card"><div class="label">남은 이자 합계</div><div class="big num">${won(interestSum)}</div></div>
    <div class="card"><div class="label">모든 대출 종료</div><div class="big num">${lastEnd ? monthLabel(monthIdx(lastEnd)) : '-'}</div></div>
  </section>` + cards;
}

/* ---------- 항목 입력 ---------- */
let editingId = null;
function itemModal(item, type) {
  editingId = item ? item.id : null;
  const it = item || { type, name: '', amount: '', rate: '', start: '', end: '', method: 'equalPayment' };
  openModal(`<h2>${item ? '항목 수정' : '항목 추가'}</h2>
    <form id="form">
      <div class="field"><label for="f-type">분류</label><select id="f-type">
        ${Object.keys(TYPES).map(k => `<option value="${k}"${k === it.type ? ' selected' : ''}>${TYPES[k]}</option>`).join('')}</select></div>
      <div class="field"><label for="f-name">이름</label><input id="f-name" maxlength="40" value="${esc(it.name)}" placeholder="예: 급여 통장"></div>
      <div class="field"><label for="f-amount" id="f-amount-label">금액(원)</label>
        <input id="f-amount" inputmode="numeric" class="num" value="${it.amount === '' ? '' : Number(it.amount).toLocaleString('ko-KR')}">
        <div class="hint" id="f-hint">${it.amount === '' ? '' : korean(it.amount)}</div></div>
      <div id="f-debt">
        <div class="field"><label for="f-rate">연 금리(%)</label><input id="f-rate" inputmode="decimal" value="${it.rate ?? ''}"></div>
        <div class="field"><label for="f-start">대출 시작월</label><input id="f-start" type="month" value="${it.start || ''}"></div>
        <div class="field"><label for="f-end">만기월</label><input id="f-end" type="month" value="${it.end || ''}"></div>
        <div class="field"><label for="f-grace">거치기간(년)</label><input id="f-grace" inputmode="decimal" value="${it.grace ? it.grace / 12 : ''}"></div>
        <div class="field"><label for="f-method">상환 방식</label><select id="f-method">
          ${Object.keys(METHODS).map(k => `<option value="${k}"${k === it.method ? ' selected' : ''}>${METHODS[k]}</option>`).join('')}</select></div>
        <div class="hint" id="f-calc"></div>
      </div>
      <div class="actions"><button type="button" data-action="close">취소</button><button class="primary" type="submit">저장</button></div>
    </form>`);
  const preview = () => {
    const debt = $('f-type').value === 'debt';
    $('f-debt').hidden = !debt;
    $('f-amount-label').textContent = debt ? '대출 원금(처음 빌린 금액, 원)' : '금액(원)';
    if (!debt) return;
    const rate = $('f-rate').value.trim();
    const L = loanInfo({
      amount: Number($('f-amount').value.replace(/\D/g, '')),
      rate: rate === '' ? NaN : Number(rate),
      start: $('f-start').value, end: $('f-end').value, method: $('f-method').value,
      grace: graceMonths($('f-grace').value)
    });
    $('f-calc').textContent = !L ? '금리·시작월·만기월 입력 시 월 상환액 자동 계산'
      : L.done ? '상환 완료'
      : `현재 잔액 ${won(L.balance)} · 월 ${won(L.payment)} · ${L.endLabel}까지 ${L.left.length}개월${L.afterPayment ? ` · 거치 후 월 ${won(L.afterPayment)} (${L.afterMonths}개월)` : ''}`;
  };
  preview();
  $('form').addEventListener('input', preview);
  $('form').addEventListener('change', preview);
  $('f-amount').addEventListener('input', e => {
    const digits = e.target.value.replace(/\D/g, '').slice(0, 15);
    e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
    $('f-hint').textContent = digits ? korean(Number(digits)) : '';
  });
  $('form').addEventListener('submit', submitItem);
  $('f-name').focus();
}

function buildItem(v, id) {
  if (!v.name) { toast('이름 입력 필요'); return null; }
  if (!v.amountText) { toast('금액 입력 필요'); return null; }
  const item = { id: id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6), type: v.type, name: v.name, amount: Number(v.amountText) };
  if (v.type === 'debt') {
    if (v.rate !== '' || v.start || v.end) {
      const rate = Number(v.rate);
      if (v.rate === '' || !Number.isFinite(rate) || rate < 0 || rate > 100) { toast('금리 확인 필요'); return null; }
      if (!v.start || !v.end) { toast('시작월·만기월 입력 필요'); return null; }
      const grace = graceMonths(v.grace);
      if (!(grace >= 0)) { toast('거치기간 확인 필요'); return null; }
      if (!loanInfo({ amount: item.amount, rate, start: v.start, end: v.end, method: v.method, grace })) { toast('기간·거치기간 확인 필요'); return null; }
      item.rate = rate; item.start = v.start; item.end = v.end;
      if (grace) item.grace = grace;
    }
    item.method = v.method;
  }
  return item;
}

/* ---------- 목록 아래 바로 입력 ---------- */
const QUICK_HINT = { cash: '예: 급여 통장', stock: '예: 삼성전자', realestate: '예: 아파트', other: '예: 자동차', debt: '예: 주택담보대출' };

function quickForm(type) {
  const debt = type === 'debt';
  return `<form class="quick" data-type="${type}" autocomplete="off">
    <label class="q grow"><span>이름</span><input name="name" maxlength="40" placeholder="${QUICK_HINT[type]}"></label>
    <label class="q"><span>${debt ? '대출 원금(원)' : '금액(원)'}</span><input name="amount" inputmode="numeric" class="num"></label>
    ${debt ? `<label class="q"><span>연 금리(%)</span><input name="rate" inputmode="decimal"></label>
    <label class="q"><span>시작월</span><input name="start" type="month"></label>
    <label class="q"><span>만기월</span><input name="end" type="month"></label>
    <label class="q"><span>거치기간(년)</span><input name="grace" inputmode="decimal"></label>
    <label class="q"><span>상환 방식</span><select name="method">
      ${Object.keys(METHODS).map(k => `<option value="${k}">${METHODS[k]}</option>`).join('')}</select></label>` : ''}
    <div class="hint q-calc"></div>
  </form>`;
}

function quickValues(f) {
  const g = n => f.elements[n] ? f.elements[n].value : '';
  return { type: f.dataset.type, name: g('name').trim(), amountText: g('amount').replace(/\D/g, ''),
    rate: g('rate').trim(), start: g('start'), end: g('end'), method: g('method'), grace: g('grace') };
}

function updateQuickHint(f) {
  const v = quickValues(f), amount = Number(v.amountText);
  let text = amount ? korean(amount) : '';
  if (v.type === 'debt') {
    const L = loanInfo({ amount, rate: v.rate === '' ? NaN : Number(v.rate), start: v.start, end: v.end, method: v.method, grace: graceMonths(v.grace) });
    if (L) text = L.done ? '상환 완료' : `현재 잔액 ${won(L.balance)} · 월 ${won(L.payment)} · ${L.endLabel}까지 ${L.left.length}개월${L.afterPayment ? ` · 거치 후 월 ${won(L.afterPayment)} (${L.afterMonths}개월)` : ''}`;
  }
  f.querySelector('.q-calc').textContent = text;
}

function onQuickInput(e) {
  const f = e.target.closest && e.target.closest('.quick');
  if (!f) return;
  if (e.target.name === 'amount') {
    const digits = e.target.value.replace(/\D/g, '').slice(0, 15);
    e.target.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  }
  updateQuickHint(f);
}
document.addEventListener('input', onQuickInput);
document.addEventListener('change', onQuickInput);

document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const f = e.target.closest && e.target.closest('.quick');
  if (!f) return;
  e.preventDefault();
  f.requestSubmit();
});

/* 금액 더블클릭 수정 (대출은 계산 잔액이라 수정 창으로 연결) */
document.addEventListener('dblclick', e => {
  const el = e.target.closest('.amt[data-id]');
  if (!el) return;
  const it = state.items.find(i => i.id === el.dataset.id);
  if (!it) return;
  if (it.type === 'debt' && loanInfo(it)) return itemModal(it);
  const input = document.createElement('input');
  input.className = 'amt-edit num';
  input.inputMode = 'numeric';
  input.value = it.amount.toLocaleString('ko-KR');
  el.replaceWith(input);
  input.focus();
  input.select();
  let done = false;
  const finish = ok => {
    if (done) return;
    done = true;
    if (ok) {
      const digits = input.value.replace(/\D/g, '');
      if (digits) { it.amount = Number(digits); save(); toast('수정 완료'); }
      else toast('금액 입력 필요');
    }
    render();
  };
  input.addEventListener('input', () => {
    const digits = input.value.replace(/\D/g, '').slice(0, 15);
    input.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
  });
  input.addEventListener('keydown', ev => {
    if (ev.isComposing) return;
    if (ev.key === 'Enter') finish(true);
    else if (ev.key === 'Escape') finish(false);
  });
  input.addEventListener('blur', () => finish(true));
});

document.addEventListener('submit', e => {
  const f = e.target.closest('.quick');
  if (!f) return;
  e.preventDefault();
  const item = buildItem(quickValues(f));
  if (!item) return;
  state.items.push(item);
  save(); render(); toast('추가 완료');
  const next = document.querySelector(`.quick[data-type="${item.type}"] [name="name"]`);
  if (next) next.focus();
});

function submitItem(e) {
  e.preventDefault();
  const item = buildItem({
    type: $('f-type').value, name: $('f-name').value.trim(), amountText: $('f-amount').value.replace(/\D/g, ''),
    rate: $('f-rate').value.trim(), start: $('f-start').value, end: $('f-end').value, method: $('f-method').value,
    grace: $('f-grace').value
  }, editingId);
  if (!item) return;
  const idx = state.items.findIndex(i => i.id === editingId);
  if (idx >= 0) state.items[idx] = item; else state.items.push(item);
  save(); closeModal(); render();
  toast('저장 완료');
}

/* ---------- 동작 ---------- */
document.addEventListener('click', e => {
  if (e.target === $('modal')) return closeModal();
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { tab = tabBtn.dataset.tab; return render(); }
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;
  if (a === 'close') closeModal();
  else if (a === 'confirm') { const fn = onConfirm; onConfirm = null; closeModal(); fn && fn(); }
  else if (a === 'edit') itemModal(state.items.find(i => i.id === b.dataset.id));
  else if (a === 'del') {
    const it = state.items.find(i => i.id === b.dataset.id);
    confirmModal(`'${it.name}' 삭제`, '삭제', () => {
      state.items = state.items.filter(i => i.id !== it.id);
      save(); render(); toast('삭제 완료');
    });
  }
  else if (a === 'snap') {
    const t = totals(state.items), month = thisMonth();
    state.snapshots = state.snapshots.filter(p => p.month !== month);
    state.snapshots.push({ month, assets: t.assets, debts: t.debts });
    state.snapshots.sort((p, q) => p.month.localeCompare(q.month));
    save(); render(); toast(month + ' 기록 완료');
  }
  else if (a === 'delsnap') {
    const month = b.dataset.month;
    confirmModal(month + ' 기록 삭제', '삭제', () => {
      state.snapshots = state.snapshots.filter(p => p.month !== month);
      save(); render(); toast('삭제 완료');
    });
  }
  else if (a === 'export') {
    const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = '재정관리-백업-' + new Date().toISOString().slice(0, 10) + '.json';
    link.click();
    URL.revokeObjectURL(url);
  }
  else if (a === 'import') $('file').click();
  else if (a === 'logout') {
    confirmModal('로그아웃 · 이 기기의 저장 내용 삭제', '로그아웃', async () => {
      if (dirty || saving) await flushNow();
      dropAuth();
      localStorage.removeItem(KEY);
      localStorage.removeItem(PENDING_KEY);
      state = { items: [], snapshots: [] };
      render();
    });
  }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

$('file').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (err) { return toast('백업 파일 형식 오류'); }
  if (!valid(data)) return toast('백업 파일 형식 오류');
  confirmModal('현재 내용을 백업 파일로 교체', '교체', () => {
    state = { items: data.items, snapshots: data.snapshots };
    save(); render(); toast('불러오기 완료');
  });
});

render();
if (auth) syncDown(false);
</script>
</body>
</html>
